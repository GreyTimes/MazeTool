plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '2.0.1'
}

group = 'com.maze'
version = '2.0.0'

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.base','javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.swing']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javadoc {
    options.author = true
    options.version = true
    options.windowTitle = "Maze Generator & Solver API Documentation"
}

application {
    mainClass = 'app.MazinStuffLauncher'
    applicationName = 'MazinStuff'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

runtime {
    options = [
            '--strip-debug',
            '--compress', '2',
            '--no-header-files',
            '--no-man-pages'
    ]

    // Required JDK modules
    modules = [
            'java.desktop',
            'java.prefs',
            'java.logging',
            'jdk.unsupported'
    ]

    // APPLICATION LAUNCHER

    launcher {
        noConsole = true
    }

    // NATIVE INSTALLER

    jpackage {
        imageName = 'MazinStuff'
        installerName = 'MazinStuff'
        appVersion = project.version.toString()
        installerType = 'exe'
        imageOptions = [
                '--icon',
                file("$projectDir/packaging/MazinStuff.ico").absolutePath
        ]
        installerOptions = [
                '--win-per-user-install',
                '--win-dir-chooser',
                '--win-menu',
                '--win-shortcut',
                '--vendor',
                'GreyTimes',
                '--description',
                'MazeTool - JavaFX Maze Generator and Solver'
        ]
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'MazinStuff',
                'Implementation-Version': project.version.toString(),
                'Implementation-Vendor': 'GreyTimes'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}